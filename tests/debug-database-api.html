<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库API调试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .error { background: #ffe6e6; color: #d00; }
        .success { background: #e6ffe6; color: #060; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>数据库API调试工具</h1>
    
    <div class="section">
        <h2>1. 测试连接列表API</h2>
        <button onclick="testConnections()">获取连接列表</button>
        <div id="connections-result" class="result"></div>
    </div>

    <div class="section">
        <h2>2. 测试数据库列表API</h2>
        <button onclick="testDatabases()">获取数据库列表</button>
        <div id="databases-result" class="result"></div>
    </div>

    <div class="section">
        <h2>3. 测试默认连接</h2>
        <button onclick="testDefaultConnection()">获取默认连接</button>
        <div id="default-connection-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api/v1';

        async function testConnections() {
            const resultDiv = document.getElementById('connections-result');
            try {
                const response = await fetch(`${API_BASE}/database/connections`);
                const data = await response.json();
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4>连接列表 (${data.connections?.length || 0} 个):</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h4>错误:</h4><pre>${error.message}</pre>`;
            }
        }

        async function testDatabases() {
            const resultDiv = document.getElementById('databases-result');
            try {
                // 先获取连接列表
                const connectionsResponse = await fetch(`${API_BASE}/database/connections`);
                const connectionsData = await connectionsResponse.json();
                
                if (!connectionsData.connections || connectionsData.connections.length === 0) {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = '<h4>错误:</h4><p>没有找到可用的连接配置</p>';
                    return;
                }

                // 使用第一个连接获取数据库列表
                const connection = connectionsData.connections[0];
                const databasesResponse = await fetch(`${API_BASE}/database/databases?connection_id=${connection.id}`);
                const databasesData = await databasesResponse.json();
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4>使用连接: ${connection.name}</h4>
                    <h4>数据库列表 (${databasesData.databases?.length || 0} 个):</h4>
                    <pre>${JSON.stringify(databasesData, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h4>错误:</h4><pre>${error.message}</pre>`;
            }
        }

        async function testDefaultConnection() {
            const resultDiv = document.getElementById('default-connection-result');
            try {
                const response = await fetch(`${API_BASE}/database/connections`);
                const data = await response.json();
                
                const defaultConnection = data.connections?.find(conn => conn.is_default);
                const firstConnection = data.connections?.[0];
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4>默认连接:</h4>
                    <pre>${JSON.stringify(defaultConnection || null, null, 2)}</pre>
                    <h4>第一个连接:</h4>
                    <pre>${JSON.stringify(firstConnection || null, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h4>错误:</h4><pre>${error.message}</pre>`;
            }
        }

        // 页面加载时自动测试
        window.onload = function() {
            testConnections();
        };
    </script>
</body>
</html>

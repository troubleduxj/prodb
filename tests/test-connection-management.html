<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接管理测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.warning { background: #fff3cd; color: #856404; }
        .status.error { background: #f8d7da; color: #721c24; }
        .connection-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            margin: 10px 0;
        }
        .connection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .connection-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .detail-item {
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        .detail-label {
            font-weight: bold;
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
        }
        .detail-value {
            font-size: 14px;
            color: #212529;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
        }
        button:hover { background: #0056b3; }
        button.secondary {
            background: #6c757d;
        }
        button.secondary:hover { background: #545b62; }
        button.danger {
            background: #dc3545;
        }
        button.danger:hover { background: #c82333; }
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .summary-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }
        .summary-number {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }
        .summary-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>🔗 TDengine连接管理测试</h1>
    
    <div class="test-section">
        <h2>📊 连接概览</h2>
        <div class="summary">
            <div class="summary-card">
                <div class="summary-number" id="totalConnections">3</div>
                <div class="summary-label">总连接数</div>
            </div>
            <div class="summary-card">
                <div class="summary-number" id="onlineConnections" style="color: #28a745;">2</div>
                <div class="summary-label">在线连接</div>
            </div>
            <div class="summary-card">
                <div class="summary-number" id="avgLatency">45.2ms</div>
                <div class="summary-label">平均延迟</div>
            </div>
            <div class="summary-card">
                <div class="summary-number" id="successRate">96.7%</div>
                <div class="summary-label">成功率</div>
            </div>
        </div>
    </div>

    <div class="test-section">
        <h2>🔧 连接管理功能</h2>
        <div style="margin-bottom: 15px;">
            <button onclick="refreshConnections()">🔄 刷新连接</button>
            <button onclick="addConnection()">➕ 新建连接</button>
            <button onclick="batchTest()">🧪 批量测试</button>
            <button onclick="exportConfig()" class="secondary">📥 导出配置</button>
        </div>
        
        <div id="connectionsList">
            <!-- 连接列表将在这里动态生成 -->
        </div>
    </div>

    <div class="test-section">
        <h2>📈 连接监控</h2>
        <p>实时监控各个数据库连接的状态和性能指标</p>
        <div id="monitoringData">
            <!-- 监控数据将在这里显示 -->
        </div>
    </div>

    <div class="test-section">
        <h2>✅ 功能验证清单</h2>
        <div id="checkList">
            <div><span class="status success">✅</span> 页面正常加载</div>
            <div><span class="status success">✅</span> 显示连接列表</div>
            <div><span class="status success">✅</span> 连接状态显示</div>
            <div><span class="status success">✅</span> 连接详细信息</div>
            <div><span class="status success">✅</span> 操作按钮功能</div>
            <div><span class="status success">✅</span> 监控数据展示</div>
        </div>
    </div>

    <script>
        // 模拟连接数据
        const mockConnections = [
            {
                id: '1',
                name: '生产环境',
                host: '192.168.1.100',
                port: 6041,
                username: 'root',
                database: 'production_db',
                timeout: 5000,
                maxConnections: 20,
                isDefault: true,
                status: 'connected',
                lastConnected: new Date().toISOString(),
                description: '生产环境数据库连接',
                latency: 35.2,
                uptime: 86400,
                successRate: 98.5,
                activeConnections: 15,
                errorCount: 2
            },
            {
                id: '2',
                name: '测试环境',
                host: '192.168.1.101',
                port: 6041,
                username: 'root',
                database: 'test_db',
                timeout: 5000,
                maxConnections: 10,
                isDefault: false,
                status: 'connected',
                lastConnected: new Date(Date.now() - 3600000).toISOString(),
                description: '测试环境数据库连接',
                latency: 55.8,
                uptime: 3600,
                successRate: 95.2,
                activeConnections: 5,
                errorCount: 1
            },
            {
                id: '3',
                name: '开发环境',
                host: '192.168.1.102',
                port: 6041,
                username: 'root',
                database: 'dev_db',
                timeout: 5000,
                maxConnections: 5,
                isDefault: false,
                status: 'disconnected',
                lastConnected: new Date(Date.now() - 1800000).toISOString(),
                description: '开发环境数据库连接',
                latency: 0,
                uptime: 0,
                successRate: 92.1,
                activeConnections: 0,
                errorCount: 5
            }
        ];

        function renderConnections() {
            const container = document.getElementById('connectionsList');
            container.innerHTML = '';

            mockConnections.forEach(conn => {
                const statusClass = conn.status === 'connected' ? 'success' : 
                                  conn.status === 'disconnected' ? 'error' : 'warning';
                const statusText = conn.status === 'connected' ? '已连接' : 
                                 conn.status === 'disconnected' ? '未连接' : '连接中';

                const connectionCard = document.createElement('div');
                connectionCard.className = 'connection-card';
                connectionCard.innerHTML = `
                    <div class="connection-header">
                        <div>
                            <h4>${conn.name}</h4>
                            <p style="color: #6c757d; margin: 0;">${conn.host}:${conn.port} / ${conn.database}</p>
                        </div>
                        <div>
                            <span class="status ${statusClass}">${statusText}</span>
                            ${conn.isDefault ? '<span class="status" style="background: #e7f3ff; color: #0066cc;">默认</span>' : ''}
                        </div>
                    </div>
                    
                    <div class="connection-details">
                        <div class="detail-item">
                            <div class="detail-label">用户名</div>
                            <div class="detail-value">${conn.username}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">超时时间</div>
                            <div class="detail-value">${conn.timeout}ms</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">最大连接数</div>
                            <div class="detail-value">${conn.maxConnections}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">最后连接</div>
                            <div class="detail-value">${new Date(conn.lastConnected).toLocaleString()}</div>
                        </div>
                    </div>

                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #dee2e6;">
                        <div style="color: #6c757d; font-size: 14px; margin-bottom: 10px;">
                            ${conn.description}
                        </div>
                        <div class="actions">
                            <button onclick="testConnection('${conn.id}')">🧪 测试连接</button>
                            <button onclick="editConnection('${conn.id}')" class="secondary">✏️ 编辑</button>
                            <button onclick="deleteConnection('${conn.id}')" class="danger">🗑️ 删除</button>
                        </div>
                    </div>
                `;
                container.appendChild(connectionCard);
            });
        }

        function renderMonitoring() {
            const container = document.getElementById('monitoringData');
            container.innerHTML = '';

            mockConnections.forEach(conn => {
                if (conn.status === 'connected') {
                    const monitorCard = document.createElement('div');
                    monitorCard.className = 'connection-card';
                    monitorCard.innerHTML = `
                        <div class="connection-header">
                            <h4>${conn.name}</h4>
                            <span class="status success">在线</span>
                        </div>
                        
                        <div class="connection-details">
                            <div class="detail-item">
                                <div class="detail-label">延迟</div>
                                <div class="detail-value" style="color: #007bff;">${conn.latency}ms</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">运行时间</div>
                                <div class="detail-value" style="color: #28a745;">${Math.floor(conn.uptime / 3600)}小时</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">成功率</div>
                                <div class="detail-value" style="color: #6f42c1;">${conn.successRate}%</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">错误次数</div>
                                <div class="detail-value" style="color: #dc3545;">${conn.errorCount}</div>
                            </div>
                        </div>

                        <div style="margin-top: 10px;">
                            <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
                                <span>连接池使用率</span>
                                <span>${conn.activeConnections}/${conn.maxConnections}</span>
                            </div>
                            <div style="background: #e9ecef; height: 8px; border-radius: 4px;">
                                <div style="background: #007bff; height: 100%; width: ${(conn.activeConnections / conn.maxConnections) * 100}%; border-radius: 4px;"></div>
                            </div>
                        </div>
                    `;
                    container.appendChild(monitorCard);
                }
            });
        }

        // 功能函数
        function refreshConnections() {
            console.log('刷新连接列表');
            // 模拟刷新延迟
            setTimeout(() => {
                renderConnections();
                renderMonitoring();
                updateSummary();
            }, 500);
        }

        function addConnection() {
            console.log('打开新建连接对话框');
            alert('新建连接功能 - 将打开连接配置对话框');
        }

        function batchTest() {
            console.log('批量测试所有连接');
            alert('批量测试功能 - 正在测试所有连接...');
        }

        function exportConfig() {
            console.log('导出连接配置');
            alert('导出配置功能 - 将下载配置文件');
        }

        function testConnection(id) {
            console.log('测试连接:', id);
            const conn = mockConnections.find(c => c.id === id);
            alert(`测试连接: ${conn.name}\n结果: 连接成功\n延迟: ${conn.latency}ms`);
        }

        function editConnection(id) {
            console.log('编辑连接:', id);
            const conn = mockConnections.find(c => c.id === id);
            alert(`编辑连接: ${conn.name}\n将打开编辑对话框`);
        }

        function deleteConnection(id) {
            console.log('删除连接:', id);
            const conn = mockConnections.find(c => c.id === id);
            if (confirm(`确定要删除连接 "${conn.name}" 吗？`)) {
                alert('连接已删除');
            }
        }

        function updateSummary() {
            const total = mockConnections.length;
            const online = mockConnections.filter(c => c.status === 'connected').length;
            const avgLatency = mockConnections
                .filter(c => c.status === 'connected')
                .reduce((sum, c) => sum + c.latency, 0) / online;
            const avgSuccess = mockConnections
                .reduce((sum, c) => sum + c.successRate, 0) / total;

            document.getElementById('totalConnections').textContent = total;
            document.getElementById('onlineConnections').textContent = online;
            document.getElementById('avgLatency').textContent = avgLatency.toFixed(1) + 'ms';
            document.getElementById('successRate').textContent = avgSuccess.toFixed(1) + '%';
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            renderConnections();
            renderMonitoring();
            updateSummary();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库连接测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #0056b3; }
        .connection-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>数据库连接测试</h1>
    
    <div id="status" class="status info">准备测试...</div>
    
    <button onclick="testAPI()">测试API连接</button>
    <button onclick="loadConnections()">加载连接列表</button>
    
    <div id="connections"></div>

    <script>
        const API_BASE_URL = 'http://localhost:3001/api/v1';
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        async function testAPI() {
            updateStatus('正在测试API连接...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/database/connections`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                updateStatus(`API连接成功！返回 ${data.data?.length || 0} 个连接`, 'success');
                return data;
            } catch (error) {
                updateStatus(`API连接失败: ${error.message}`, 'error');
                throw error;
            }
        }
        
        async function loadConnections() {
            try {
                const data = await testAPI();
                const connectionsDiv = document.getElementById('connections');
                
                if (data.data && data.data.length > 0) {
                    connectionsDiv.innerHTML = '<h3>连接列表:</h3>' + 
                        data.data.map(conn => `
                            <div class="connection-item">
                                <strong>${conn.name}</strong><br>
                                主机: ${conn.host}:${conn.port}<br>
                                用户: ${conn.username}<br>
                                状态: ${conn.status || '未知'}<br>
                                数据库: ${conn.database || '无'}
                            </div>
                        `).join('');
                } else {
                    connectionsDiv.innerHTML = '<p>暂无连接配置</p>';
                }
            } catch (error) {
                document.getElementById('connections').innerHTML = 
                    `<p class="error">加载连接失败: ${error.message}</p>`;
            }
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            loadConnections();
        };
    </script>
</body>
</html>

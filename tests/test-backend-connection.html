<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .status {
            padding: 8px 16px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #cce7ff; color: #004085; border: 1px solid #b3d7ff; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .result {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🔗 后端API连接测试</h1>
    
    <div class="info">
        <strong>测试说明:</strong> 确保后端服务器在端口8080运行
    </div>
    
    <div>
        <button onclick="testPing()">🏥 测试Ping</button>
        <button onclick="testConnections()">📋 测试连接列表</button>
        <button onclick="testConnectionStatus()">📊 测试连接状态</button>
        <button onclick="testCreateConnection()">➕ 测试创建连接</button>
    </div>
    
    <div id="status"></div>
    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:8080';
        
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        function showResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="result">${JSON.stringify(data, null, 2)}</div>`;
        }
        
        async function testPing() {
            showStatus('测试Ping连接...', 'info');
            try {
                const response = await fetch(`${API_BASE}/ping`);
                if (response.ok) {
                    const data = await response.json();
                    showStatus('✅ Ping测试成功！后端服务器正常运行', 'success');
                    showResult(data);
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                showStatus(`❌ Ping测试失败: ${error.message}`, 'error');
                showResult({ error: error.message });
            }
        }
        
        async function testConnections() {
            showStatus('获取连接列表...', 'info');
            try {
                const response = await fetch(`${API_BASE}/api/v1/database/connections`);
                if (response.ok) {
                    const data = await response.json();
                    showStatus(`✅ 连接列表获取成功！找到 ${data.total || 0} 个连接`, 'success');
                    showResult(data);
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                showStatus(`❌ 连接列表获取失败: ${error.message}`, 'error');
                showResult({ error: error.message });
            }
        }
        
        async function testConnectionStatus() {
            showStatus('获取连接状态...', 'info');
            try {
                const response = await fetch(`${API_BASE}/api/v1/database/connections/status`);
                if (response.ok) {
                    const data = await response.json();
                    showStatus(`✅ 连接状态获取成功！`, 'success');
                    showResult(data);
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                showStatus(`❌ 连接状态获取失败: ${error.message}`, 'error');
                showResult({ error: error.message });
            }
        }
        
        async function testCreateConnection() {
            showStatus('测试创建连接...', 'info');
            try {
                const testConnection = {
                    name: `测试连接_${Date.now()}`,
                    host: 'localhost',
                    port: 6041,
                    username: 'root',
                    password: 'taosdata',
                    database: 'test',
                    max_open_conns: 20,
                    max_idle_conns: 10,
                    conn_timeout: 30,
                    is_default: false,
                    description: '自动化测试创建的连接'
                };
                
                const response = await fetch(`${API_BASE}/api/v1/database/connections`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testConnection)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showStatus('✅ 连接创建成功！', 'success');
                    showResult(data);
                } else {
                    const errorData = await response.json();
                    throw new Error(`HTTP ${response.status}: ${errorData.message || response.statusText}`);
                }
            } catch (error) {
                showStatus(`❌ 连接创建失败: ${error.message}`, 'error');
                showResult({ error: error.message });
            }
        }
        
        // 页面加载时自动测试ping
        window.addEventListener('load', () => {
            setTimeout(testPing, 1000);
        });
    </script>
</body>
</html>

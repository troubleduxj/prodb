<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDB Collector - Status Check</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .status-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.2s ease;
        }
        .status-card:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .status-icon {
            font-size: 24px;
        }
        .status-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .status-content {
            font-size: 14px;
            color: #cbd5e1;
        }
        .status-success {
            border-left: 4px solid #10b981;
        }
        .status-error {
            border-left: 4px solid #ef4444;
        }
        .status-warning {
            border-left: 4px solid #f59e0b;
        }
        .status-info {
            border-left: 4px solid #06b6d4;
        }
        .test-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: background-color 0.2s ease;
        }
        .test-button:hover {
            background: #1d4ed8;
        }
        .test-button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .console-output {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top: 2px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 ProDB Collector Status Check</h1>
            <p>Verification of system components and functionality</p>
        </div>

        <div class="status-grid" id="status-grid">
            <!-- Status cards will be populated by JavaScript -->
        </div>

        <div class="test-section">
            <h2>🧪 Manual Tests</h2>
            <button class="test-button" onclick="runAllTests()">Run All Tests</button>
            <button class="test-button" onclick="testValidation()">Test Validation</button>
            <button class="test-button" onclick="testServiceWorker()">Test Service Worker</button>
            <button class="test-button" onclick="testAPI()">Test API</button>
            <button class="test-button" onclick="clearConsole()">Clear Console</button>
        </div>

        <div class="console-section">
            <h2>📋 Console Output</h2>
            <div class="console-output" id="console-output"></div>
        </div>
    </div>

    <script type="module">
        const statusGrid = document.getElementById('status-grid');
        const consoleOutput = document.getElementById('console-output');
        
        // Console capture
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(type, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            consoleOutput.textContent += `[${timestamp}] [${type.toUpperCase()}] ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog(...args);
            addToConsole('log', ...args);
        };
        
        console.error = (...args) => {
            originalError(...args);
            addToConsole('error', ...args);
        };
        
        console.warn = (...args) => {
            originalWarn(...args);
            addToConsole('warn', ...args);
        };
        
        // Status management
        const statusChecks = [
            {
                id: 'browser',
                title: 'Browser Compatibility',
                icon: '🌐',
                check: checkBrowserCompatibility
            },
            {
                id: 'modules',
                title: 'ES6 Modules',
                icon: '📦',
                check: checkModuleSupport
            },
            {
                id: 'validation',
                title: 'Validation Module',
                icon: '✅',
                check: checkValidationModule
            },
            {
                id: 'serviceworker',
                title: 'Service Worker',
                icon: '⚙️',
                check: checkServiceWorker
            },
            {
                id: 'pwa',
                title: 'PWA Features',
                icon: '📱',
                check: checkPWAFeatures
            },
            {
                id: 'storage',
                title: 'Local Storage',
                icon: '💾',
                check: checkLocalStorage
            }
        ];
        
        function createStatusCard(check) {
            return `
                <div class="status-card status-info" id="card-${check.id}">
                    <div class="status-header">
                        <span class="status-icon">${check.icon}</span>
                        <h3 class="status-title">${check.title}</h3>
                        <div class="loading" id="loading-${check.id}"></div>
                    </div>
                    <div class="status-content" id="content-${check.id}">
                        Checking...
                    </div>
                </div>
            `;
        }
        
        function updateStatusCard(id, status, message, details = '') {
            const card = document.getElementById(`card-${id}`);
            const content = document.getElementById(`content-${id}`);
            const loading = document.getElementById(`loading-${id}`);
            
            loading.style.display = 'none';
            
            card.className = `status-card status-${status}`;
            content.innerHTML = `
                <div>${message}</div>
                ${details ? `<div style="margin-top: 10px; font-size: 12px; opacity: 0.8;">${details}</div>` : ''}
            `;
        }
        
        // Check functions
        async function checkBrowserCompatibility() {
            const features = {
                'ES6 Modules': 'noModule' in HTMLScriptElement.prototype,
                'Service Workers': 'serviceWorker' in navigator,
                'Local Storage': typeof Storage !== 'undefined',
                'Fetch API': typeof fetch !== 'undefined',
                'Promise': typeof Promise !== 'undefined'
            };
            
            const supported = Object.values(features).every(Boolean);
            const details = Object.entries(features)
                .map(([name, support]) => `${name}: ${support ? '✅' : '❌'}`)
                .join('<br>');
            
            return {
                status: supported ? 'success' : 'error',
                message: supported ? 'Browser fully compatible' : 'Some features not supported',
                details
            };
        }
        
        async function checkModuleSupport() {
            try {
                // Test dynamic import
                const testModule = await import('data:text/javascript,export const test = "ok"');
                
                return {
                    status: 'success',
                    message: 'ES6 modules working correctly',
                    details: 'Dynamic imports and module loading functional'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Module loading failed',
                    details: error.message
                };
            }
        }
        
        async function checkValidationModule() {
            try {
                const { Validator, validator, protocolValidators, formValidators } = await import('./utils/validation.js');
                
                // Test basic validation
                const result = validator.validateField('test', 'value', [{ type: 'required' }]);
                
                if (!result || typeof result.valid !== 'boolean') {
                    throw new Error('Validation result format incorrect');
                }
                
                // Test protocol validation
                const opcuaResult = protocolValidators.opcuaEndpoint('opc.tcp://localhost:4840');
                if (!opcuaResult || typeof opcuaResult.valid !== 'boolean') {
                    throw new Error('Protocol validation failed');
                }
                
                return {
                    status: 'success',
                    message: 'Validation module working correctly',
                    details: 'All validation functions operational'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Validation module failed',
                    details: error.message
                };
            }
        }
        
        async function checkServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                return {
                    status: 'error',
                    message: 'Service Worker not supported',
                    details: 'Browser does not support Service Workers'
                };
            }
            
            try {
                const registration = await navigator.serviceWorker.register('/sw.js');
                
                return {
                    status: 'success',
                    message: 'Service Worker registered successfully',
                    details: `Scope: ${registration.scope}`
                };
            } catch (error) {
                return {
                    status: 'warning',
                    message: 'Service Worker registration failed',
                    details: error.message
                };
            }
        }
        
        async function checkPWAFeatures() {
            const features = {
                'Manifest': document.querySelector('link[rel="manifest"]') !== null,
                'Service Worker': 'serviceWorker' in navigator,
                'Cache API': 'caches' in window,
                'Background Sync': 'serviceWorker' in navigator && 'sync' in window.ServiceWorkerRegistration.prototype,
                'Push Notifications': 'Notification' in window
            };
            
            const supportedCount = Object.values(features).filter(Boolean).length;
            const totalCount = Object.keys(features).length;
            
            const details = Object.entries(features)
                .map(([name, support]) => `${name}: ${support ? '✅' : '❌'}`)
                .join('<br>');
            
            const status = supportedCount === totalCount ? 'success' : 
                          supportedCount > totalCount / 2 ? 'warning' : 'error';
            
            return {
                status,
                message: `PWA features: ${supportedCount}/${totalCount} supported`,
                details
            };
        }
        
        async function checkLocalStorage() {
            try {
                const testKey = 'prodb-test';
                const testValue = 'test-value';
                
                localStorage.setItem(testKey, testValue);
                const retrieved = localStorage.getItem(testKey);
                localStorage.removeItem(testKey);
                
                if (retrieved !== testValue) {
                    throw new Error('Storage value mismatch');
                }
                
                return {
                    status: 'success',
                    message: 'Local Storage working correctly',
                    details: 'Read/write operations successful'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Local Storage failed',
                    details: error.message
                };
            }
        }
        
        // Test functions
        window.testValidation = async function() {
            console.log('Testing validation module...');
            const result = await checkValidationModule();
            console.log('Validation test result:', result);
        };
        
        window.testServiceWorker = async function() {
            console.log('Testing Service Worker...');
            const result = await checkServiceWorker();
            console.log('Service Worker test result:', result);
        };
        
        window.testAPI = async function() {
            console.log('Testing API connectivity...');
            try {
                const response = await fetch('/api/v1/status');
                if (response.ok) {
                    const data = await response.json();
                    console.log('API test successful:', data);
                } else {
                    console.log('API test failed:', response.status, response.statusText);
                }
            } catch (error) {
                console.log('API test error:', error.message);
            }
        };
        
        window.runAllTests = async function() {
            console.log('Running all tests...');
            await testValidation();
            await testServiceWorker();
            await testAPI();
            console.log('All tests completed');
        };
        
        window.clearConsole = function() {
            consoleOutput.textContent = '';
        };
        
        // Initialize
        async function initialize() {
            console.log('ProDB Collector Status Check initialized');
            
            // Create status cards
            statusGrid.innerHTML = statusChecks.map(createStatusCard).join('');
            
            // Run all checks
            for (const check of statusChecks) {
                try {
                    const result = await check.check();
                    updateStatusCard(check.id, result.status, result.message, result.details);
                } catch (error) {
                    updateStatusCard(check.id, 'error', 'Check failed', error.message);
                }
            }
            
            console.log('Status check completed');
        }
        
        // Start initialization
        initialize();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDB Collector - All Fixes Test</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .test-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.2s ease;
        }
        .test-card:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
        }
        .test-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .test-icon {
            font-size: 24px;
        }
        .test-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .test-content {
            font-size: 14px;
            color: #cbd5e1;
        }
        .test-success {
            border-left: 4px solid #10b981;
        }
        .test-error {
            border-left: 4px solid #ef4444;
        }
        .test-warning {
            border-left: 4px solid #f59e0b;
        }
        .test-info {
            border-left: 4px solid #06b6d4;
        }
        .test-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin: 5px 5px 5px 0;
            transition: background-color 0.2s ease;
        }
        .test-button:hover {
            background: #1d4ed8;
        }
        .test-button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .console-output {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top: 2px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .summary {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .summary h2 {
            margin-top: 0;
            color: #2563eb;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-success { background-color: #10b981; }
        .status-error { background-color: #ef4444; }
        .status-warning { background-color: #f59e0b; }
        .status-info { background-color: #06b6d4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 ProDB Collector - All Fixes Verification</h1>
            <p>Comprehensive test of all JavaScript fixes and module imports</p>
        </div>

        <div class="summary" id="summary">
            <h2>📊 Test Summary</h2>
            <div id="summary-content">
                <p>Initializing tests...</p>
            </div>
        </div>

        <div class="test-grid" id="test-grid">
            <!-- Test cards will be populated by JavaScript -->
        </div>

        <div class="test-section">
            <h2>🧪 Manual Controls</h2>
            <button class="test-button" onclick="runAllTests()">Run All Tests</button>
            <button class="test-button" onclick="runCriticalTests()">Run Critical Tests</button>
            <button class="test-button" onclick="clearConsole()">Clear Console</button>
            <button class="test-button" onclick="exportResults()">Export Results</button>
        </div>

        <div class="console-section">
            <h2>📋 Console Output</h2>
            <div class="console-output" id="console-output"></div>
        </div>
    </div>

    <script type="module">
        const testGrid = document.getElementById('test-grid');
        const consoleOutput = document.getElementById('console-output');
        const summaryContent = document.getElementById('summary-content');
        
        // Test results storage
        const testResults = new Map();
        
        // Console capture
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(type, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            consoleOutput.textContent += `[${timestamp}] [${type.toUpperCase()}] ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog(...args);
            addToConsole('log', ...args);
        };
        
        console.error = (...args) => {
            originalError(...args);
            addToConsole('error', ...args);
        };
        
        console.warn = (...args) => {
            originalWarn(...args);
            addToConsole('warn', ...args);
        };
        
        // Test definitions
        const tests = [
            {
                id: 'validation',
                title: 'Validation Module',
                icon: '✅',
                description: 'Test validation.js module imports and functionality',
                critical: true,
                test: testValidationModule
            },
            {
                id: 'offline-manager',
                title: 'Offline Manager',
                icon: '📱',
                description: 'Test offline-manager.js module imports and functionality',
                critical: true,
                test: testOfflineManager
            },
            {
                id: 'network-api',
                title: 'Network-Aware API',
                icon: '🌐',
                description: 'Test network-aware-api.js module imports and functionality',
                critical: true,
                test: testNetworkAwareAPI
            },
            {
                id: 'access-control',
                title: 'Access Control',
                icon: '🔒',
                description: 'Test AccessControl.js module imports and exports',
                critical: true,
                test: testAccessControl
            },
            {
                id: 'config-page',
                title: 'Config Page',
                icon: '⚙️',
                description: 'Test ConfigPage.js module imports',
                critical: false,
                test: testConfigPage
            },
            {
                id: 'service-worker',
                title: 'Service Worker',
                icon: '🔧',
                description: 'Test Service Worker registration and functionality',
                critical: false,
                test: testServiceWorker
            }
        ];
        
        // Create test cards
        function createTestCard(test) {
            return `
                <div class="test-card test-info" id="card-${test.id}">
                    <div class="test-header">
                        <span class="test-icon">${test.icon}</span>
                        <h3 class="test-title">${test.title}</h3>
                        <div class="loading" id="loading-${test.id}" style="display: none;"></div>
                    </div>
                    <div class="test-content">
                        <p>${test.description}</p>
                        <div id="result-${test.id}">Ready to test</div>
                        <div style="margin-top: 10px;">
                            <button class="test-button" onclick="runSingleTest('${test.id}')">
                                Test
                            </button>
                            ${test.critical ? '<span style="color: #f59e0b; font-size: 12px;">Critical</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function updateTestCard(id, status, message, details = '') {
            const card = document.getElementById(`card-${id}`);
            const result = document.getElementById(`result-${id}`);
            const loading = document.getElementById(`loading-${id}`);
            
            loading.style.display = 'none';
            
            card.className = `test-card test-${status}`;
            result.innerHTML = `
                <div><strong>${message}</strong></div>
                ${details ? `<div style="margin-top: 5px; font-size: 12px; opacity: 0.8;">${details}</div>` : ''}
            `;
            
            testResults.set(id, { status, message, details });
            updateSummary();
        }
        
        function updateSummary() {
            const total = tests.length;
            const completed = testResults.size;
            const success = Array.from(testResults.values()).filter(r => r.status === 'success').length;
            const errors = Array.from(testResults.values()).filter(r => r.status === 'error').length;
            const warnings = Array.from(testResults.values()).filter(r => r.status === 'warning').length;
            
            summaryContent.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <div>
                        <span class="status-indicator status-info"></span>
                        <strong>Total Tests:</strong> ${total}
                    </div>
                    <div>
                        <span class="status-indicator status-success"></span>
                        <strong>Passed:</strong> ${success}
                    </div>
                    <div>
                        <span class="status-indicator status-error"></span>
                        <strong>Failed:</strong> ${errors}
                    </div>
                    <div>
                        <span class="status-indicator status-warning"></span>
                        <strong>Warnings:</strong> ${warnings}
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <strong>Progress:</strong> ${completed}/${total} tests completed
                    ${completed === total ? (errors === 0 ? ' ✅ All tests passed!' : ' ⚠️ Some tests failed') : ''}
                </div>
            `;
        }
        
        // Test functions
        async function testValidationModule() {
            try {
                const { Validator, validator, protocolValidators, formValidators } = await import('./utils/validation.js');
                
                // Test basic validation
                const result = validator.validateField('test', 'value', [{ type: 'required' }]);
                if (!result || typeof result.valid !== 'boolean') {
                    throw new Error('Validation result format incorrect');
                }
                
                // Test protocol validation
                const opcuaResult = protocolValidators.opcuaEndpoint('opc.tcp://localhost:4840');
                if (!opcuaResult || typeof opcuaResult.valid !== 'boolean') {
                    throw new Error('Protocol validation failed');
                }
                
                return {
                    status: 'success',
                    message: 'Validation module working correctly',
                    details: 'All validation functions operational'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Validation module failed',
                    details: error.message
                };
            }
        }
        
        async function testOfflineManager() {
            try {
                const { default: OfflineManager } = await import('./services/offline-manager.js');
                
                const manager = new OfflineManager();
                
                // Test basic functionality
                manager.queueOperation({
                    type: 'test',
                    data: { test: true }
                });
                
                return {
                    status: 'success',
                    message: 'Offline Manager working correctly',
                    details: 'Module imported and basic operations functional'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Offline Manager failed',
                    details: error.message
                };
            }
        }
        
        async function testNetworkAwareAPI() {
            try {
                const { default: NetworkAwareAPI } = await import('./services/network-aware-api.js');
                
                const api = new NetworkAwareAPI();
                
                return {
                    status: 'success',
                    message: 'Network-Aware API working correctly',
                    details: 'Module imported and initialized successfully'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Network-Aware API failed',
                    details: error.message
                };
            }
        }
        
        async function testAccessControl() {
            try {
                const AccessControlModule = await import('./components/AccessControl.js');
                const { default: ProtectedComponent, ProtectedButton, SensitiveDataDisplay } = AccessControlModule;
                
                if (!ProtectedComponent) {
                    throw new Error('ProtectedComponent not found in default export');
                }
                
                if (!ProtectedButton || !SensitiveDataDisplay) {
                    throw new Error('Named exports not found');
                }
                
                return {
                    status: 'success',
                    message: 'Access Control working correctly',
                    details: 'All exports available and properly structured'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Access Control failed',
                    details: error.message
                };
            }
        }
        
        async function testConfigPage() {
            try {
                const { default: ConfigPage } = await import('./pages/ConfigPage.js');
                
                if (!ConfigPage) {
                    throw new Error('ConfigPage not found');
                }
                
                return {
                    status: 'success',
                    message: 'Config Page working correctly',
                    details: 'Module imported successfully with all dependencies'
                };
            } catch (error) {
                return {
                    status: 'error',
                    message: 'Config Page failed',
                    details: error.message
                };
            }
        }
        
        async function testServiceWorker() {
            if (!('serviceWorker' in navigator)) {
                return {
                    status: 'warning',
                    message: 'Service Worker not supported',
                    details: 'Browser does not support Service Workers'
                };
            }
            
            try {
                const registration = await navigator.serviceWorker.register('/sw.js');
                
                return {
                    status: 'success',
                    message: 'Service Worker registered successfully',
                    details: `Scope: ${registration.scope}`
                };
            } catch (error) {
                return {
                    status: 'warning',
                    message: 'Service Worker registration failed',
                    details: error.message
                };
            }
        }
        
        // Test execution functions
        window.runSingleTest = async function(testId) {
            const test = tests.find(t => t.id === testId);
            if (!test) return;
            
            const loading = document.getElementById(`loading-${testId}`);
            loading.style.display = 'inline-block';
            
            console.log(`Running test: ${test.title}`);
            
            try {
                const result = await test.test();
                updateTestCard(testId, result.status, result.message, result.details);
                console.log(`Test ${test.title} completed:`, result);
            } catch (error) {
                updateTestCard(testId, 'error', 'Test execution failed', error.message);
                console.error(`Test ${test.title} failed:`, error);
            }
        };
        
        window.runAllTests = async function() {
            console.log('Running all tests...');
            
            for (const test of tests) {
                await runSingleTest(test.id);
                // Small delay between tests
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            console.log('All tests completed');
        };
        
        window.runCriticalTests = async function() {
            console.log('Running critical tests...');
            
            const criticalTests = tests.filter(t => t.critical);
            for (const test of criticalTests) {
                await runSingleTest(test.id);
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            console.log('Critical tests completed');
        };
        
        window.clearConsole = function() {
            consoleOutput.textContent = '';
        };
        
        window.exportResults = function() {
            const results = {
                timestamp: new Date().toISOString(),
                summary: {
                    total: tests.length,
                    completed: testResults.size,
                    success: Array.from(testResults.values()).filter(r => r.status === 'success').length,
                    errors: Array.from(testResults.values()).filter(r => r.status === 'error').length,
                    warnings: Array.from(testResults.values()).filter(r => r.status === 'warning').length
                },
                tests: Object.fromEntries(testResults)
            };
            
            const blob = new Blob([JSON.stringify(results, null, 2)], {
                type: 'application/json'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `prodb-collector-test-results-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            console.log('Test results exported');
        };
        
        // Initialize
        function initialize() {
            console.log('ProDB Collector - All Fixes Test initialized');
            
            // Create test cards
            testGrid.innerHTML = tests.map(createTestCard).join('');
            
            // Update initial summary
            updateSummary();
            
            console.log('Test interface ready');
        }
        
        // Start initialization
        initialize();
    </script>
</body>
</html>

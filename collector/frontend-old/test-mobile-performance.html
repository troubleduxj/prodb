<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Performance & Network Optimization Test</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/mobile-optimization.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .test-section {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-card);
        }
        
        .test-section h2 {
            margin-bottom: 20px;
            color: var(--color-primary);
        }
        
        .network-status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
        }
        
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .status-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .status-value {
            font-weight: bold;
            color: var(--text-primary);
        }
        
        .demo-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .demo-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: var(--color-primary);
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .demo-button:hover {
            background-color: var(--color-primary-hover);
        }
        
        .demo-button.secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .log-output {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .performance-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .metric-card {
            padding: 15px;
            background-color: var(--bg-secondary);
            border-radius: 6px;
            text-align: center;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-primary);
        }
        
        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Mobile Performance & Network Optimization Test</h1>
        
        <!-- Network Status Section -->
        <div class="test-section">
            <h2>Network Status</h2>
            <div class="network-status">
                <div class="status-item">
                    <div class="status-label">Connection</div>
                    <div class="status-value" id="connection-status">Online</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Type</div>
                    <div class="status-value" id="connection-type">Unknown</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Speed</div>
                    <div class="status-value" id="connection-speed">Unknown</div>
                </div>
                <div class="status-item">
                    <div class="status-label">RTT</div>
                    <div class="status-value" id="connection-rtt">Unknown</div>
                </div>
            </div>
            
            <div class="demo-buttons">
                <button class="demo-button" onclick="simulateOffline()">Simulate Offline</button>
                <button class="demo-button" onclick="simulateSlowNetwork()">Simulate Slow Network</button>
                <button class="demo-button secondary" onclick="restoreNetwork()">Restore Network</button>
            </div>
        </div>

        <!-- Enhanced Mobile Form Test -->
        <div class="test-section">
            <h2>Enhanced Mobile Form</h2>
            <div id="enhanced-form-container"></div>
        </div>

        <!-- Progressive Loading Test -->
        <div class="test-section">
            <h2>Progressive Loading</h2>
            <div class="demo-buttons">
                <button class="demo-button" onclick="testProgressiveLoading()">Test Progressive Loading</button>
                <button class="demo-button" onclick="testImageOptimization()">Test Image Optimization</button>
            </div>
            <div id="progressive-loading-container"></div>
        </div>

        <!-- Offline Functionality Test -->
        <div class="test-section">
            <h2>Offline Functionality</h2>
            <div class="demo-buttons">
                <button class="demo-button" onclick="testOfflineStorage()">Test Offline Storage</button>
                <button class="demo-button" onclick="testOfflineQueue()">Test Offline Queue</button>
                <button class="demo-button secondary" onclick="clearOfflineData()">Clear Offline Data</button>
            </div>
            <div class="log-output" id="offline-log"></div>
        </div>

        <!-- Performance Metrics -->
        <div class="test-section">
            <h2>Performance Metrics</h2>
            <div class="demo-buttons">
                <button class="demo-button" onclick="measurePerformance()">Measure Performance</button>
                <button class="demo-button secondary" onclick="clearMetrics()">Clear Metrics</button>
            </div>
            <div class="performance-metrics" id="performance-metrics"></div>
        </div>

        <!-- API Test -->
        <div class="test-section">
            <h2>Network-Aware API</h2>
            <div class="demo-buttons">
                <button class="demo-button" onclick="testNetworkAPI()">Test API Calls</button>
                <button class="demo-button" onclick="testAPIRetry()">Test Retry Logic</button>
                <button class="demo-button" onclick="testOfflineAPI()">Test Offline API</button>
            </div>
            <div class="log-output" id="api-log"></div>
        </div>
    </div>

    <script type="module">
        import { html, render } from 'https://esm.sh/htm/preact';
        import EnhancedMobileForm from './components/EnhancedMobileForm.js';
        import ProgressiveLoader, { OptimizedImage } from './components/ProgressiveLoader.js';
        import NetworkAwareAPI from './services/network-aware-api.js';
        import OfflineManager from './services/offline-manager.js';

        // Initialize services
        const networkAPI = new NetworkAwareAPI();
        const offlineManager = new OfflineManager();
        
        // Global variables for testing
        window.networkAPI = networkAPI;
        window.offlineManager = offlineManager;

        // Update network status display
        function updateNetworkStatus() {
            document.getElementById('connection-status').textContent = navigator.onLine ? 'Online' : 'Offline';
            
            if ('connection' in navigator) {
                const conn = navigator.connection;
                document.getElementById('connection-type').textContent = conn.effectiveType || 'Unknown';
                document.getElementById('connection-speed').textContent = conn.downlink ? `${conn.downlink} Mbps` : 'Unknown';
                document.getElementById('connection-rtt').textContent = conn.rtt ? `${conn.rtt} ms` : 'Unknown';
            }
        }

        // Listen for network changes
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        if ('connection' in navigator) {
            navigator.connection.addEventListener('change', updateNetworkStatus);
        }

        // Initialize network status
        updateNetworkStatus();

        // Render enhanced mobile form
        const formFields = [
            {
                name: 'protocol',
                label: 'Protocol Type',
                type: 'select',
                required: true,
                section: 'Connection',
                options: [
                    { value: 'opcua', label: 'OPC UA' },
                    { value: 'modbus', label: 'Modbus TCP' },
                    { value: 'mqtt', label: 'MQTT' }
                ]
            },
            {
                name: 'endpoint',
                label: 'Endpoint URL',
                type: 'url',
                required: true,
                section: 'Connection',
                placeholder: 'opc.tcp://192.168.1.100:4840',
                validate: (value) => {
                    if (!value.startsWith('opc.tcp://') && !value.startsWith('http://')) {
                        return 'Invalid endpoint format';
                    }
                    return true;
                }
            },
            {
                name: 'username',
                label: 'Username',
                type: 'text',
                section: 'Authentication',
                autocomplete: 'username'
            },
            {
                name: 'password',
                label: 'Password',
                type: 'password',
                section: 'Authentication',
                autocomplete: 'current-password'
            },
            {
                name: 'timeout',
                label: 'Timeout (seconds)',
                type: 'number',
                section: 'Advanced',
                min: 1,
                max: 300,
                step: 1,
                help: 'Connection timeout in seconds'
            },
            {
                name: 'enabled',
                label: 'Enable this connection',
                type: 'checkbox',
                section: 'Advanced'
            }
        ];

        render(html`
            <${EnhancedMobileForm}
                title="Protocol Configuration"
                fields=${formFields}
                autoSave=${true}
                offlineSupport=${true}
                progressiveValidation=${true}
                collapsible=${true}
                onSubmit=${(data) => {
                    console.log('Form submitted:', data);
                    logToOutput('offline-log', `Form submitted: ${JSON.stringify(data, null, 2)}`);
                }}
            />
        `, document.getElementById('enhanced-form-container'));

        // Global test functions
        window.simulateOffline = () => {
            window.dispatchEvent(new Event('offline'));
            logToOutput('offline-log', 'Simulated offline mode');
        };

        window.simulateSlowNetwork = () => {
            window.dispatchEvent(new CustomEvent('network-slow', { detail: { pollingInterval: 10000 } }));
            logToOutput('offline-log', 'Simulated slow network');
        };

        window.restoreNetwork = () => {
            window.dispatchEvent(new Event('online'));
            window.dispatchEvent(new CustomEvent('network-normal', { detail: { pollingInterval: 5000 } }));
            logToOutput('offline-log', 'Network restored');
        };

        window.testProgressiveLoading = () => {
            const container = document.getElementById('progressive-loading-container');
            render(html`
                <${ProgressiveLoader} threshold=${50}>
                    <div style="padding: 20px; background: var(--bg-secondary); border-radius: 8px;">
                        <h3>Progressively Loaded Content</h3>
                        <p>This content was loaded when it became visible in the viewport.</p>
                        <p>Load time: ${new Date().toLocaleTimeString()}</p>
                    </div>
                </${ProgressiveLoader}>
            `, container);
        };

        window.testImageOptimization = () => {
            const container = document.getElementById('progressive-loading-container');
            render(html`
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <${OptimizedImage} 
                        src="https://picsum.photos/300/200?random=1" 
                        alt="Test Image 1"
                        lazy=${true}
                    />
                    <${OptimizedImage} 
                        src="https://picsum.photos/300/200?random=2" 
                        alt="Test Image 2"
                        lazy=${true}
                    />
                    <${OptimizedImage} 
                        src="https://picsum.photos/300/200?random=3" 
                        alt="Test Image 3"
                        lazy=${true}
                    />
                </div>
            `, container);
        };

        window.testOfflineStorage = async () => {
            try {
                const testData = {
                    id: Date.now(),
                    type: 'test_config',
                    data: { protocol: 'opcua', endpoint: 'opc.tcp://test:4840' },
                    timestamp: Date.now()
                };
                
                await offlineManager.cacheManager.store('configs', testData);
                logToOutput('offline-log', `Stored offline data: ${JSON.stringify(testData)}`);
                
                const retrieved = await offlineManager.cacheManager.get('configs', testData.id);
                logToOutput('offline-log', `Retrieved offline data: ${JSON.stringify(retrieved)}`);
            } catch (error) {
                logToOutput('offline-log', `Error: ${error.message}`);
            }
        };

        window.testOfflineQueue = () => {
            offlineManager.queueOperation({
                type: 'api_call',
                url: '/api/v1/test',
                options: { method: 'POST', body: JSON.stringify({ test: true }) }
            });
            logToOutput('offline-log', 'Queued offline operation');
        };

        window.clearOfflineData = () => {
            localStorage.removeItem('offline_queue');
            logToOutput('offline-log', 'Cleared offline data');
        };

        window.measurePerformance = () => {
            const metrics = {
                'Memory Usage': `${(performance.memory?.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB` || 'N/A',
                'DOM Nodes': document.querySelectorAll('*').length,
                'Load Time': `${(performance.timing.loadEventEnd - performance.timing.navigationStart)} ms`,
                'First Paint': performance.getEntriesByType('paint').find(p => p.name === 'first-paint')?.startTime.toFixed(2) + ' ms' || 'N/A'
            };
            
            displayMetrics(metrics);
        };

        window.clearMetrics = () => {
            document.getElementById('performance-metrics').innerHTML = '';
        };

        window.testNetworkAPI = async () => {
            try {
                logToOutput('api-log', 'Testing network API...');
                const result = await networkAPI.get('/status');
                logToOutput('api-log', `API Response: ${JSON.stringify(result, null, 2)}`);
            } catch (error) {
                logToOutput('api-log', `API Error: ${error.message}`);
            }
        };

        window.testAPIRetry = async () => {
            try {
                logToOutput('api-log', 'Testing API retry logic...');
                const result = await networkAPI.get('/nonexistent-endpoint');
                logToOutput('api-log', `Unexpected success: ${JSON.stringify(result)}`);
            } catch (error) {
                logToOutput('api-log', `Expected error (retry logic): ${error.message}`);
            }
        };

        window.testOfflineAPI = async () => {
            try {
                logToOutput('api-log', 'Testing offline API...');
                // Simulate offline
                Object.defineProperty(navigator, 'onLine', { value: false, writable: true });
                
                const result = await networkAPI.post('/test', { data: 'test' });
                logToOutput('api-log', `Offline result: ${JSON.stringify(result, null, 2)}`);
                
                // Restore online
                Object.defineProperty(navigator, 'onLine', { value: true, writable: true });
            } catch (error) {
                logToOutput('api-log', `Offline error: ${error.message}`);
                Object.defineProperty(navigator, 'onLine', { value: true, writable: true });
            }
        };

        function logToOutput(elementId, message) {
            const output = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
        }

        function displayMetrics(metrics) {
            const container = document.getElementById('performance-metrics');
            container.innerHTML = '';
            
            Object.entries(metrics).forEach(([label, value]) => {
                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <div class="metric-value">${value}</div>
                    <div class="metric-label">${label}</div>
                `;
                container.appendChild(card);
            });
        }

        // Log initial load
        logToOutput('offline-log', 'Mobile performance test page loaded');
        logToOutput('api-log', 'Network-aware API initialized');
    </script>
</body>
</html>

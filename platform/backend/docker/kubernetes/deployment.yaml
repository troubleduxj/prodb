apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodb-backend
  namespace: prodb
  labels:
    app: prodb-backend
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: prodb-backend
  template:
    metadata:
      labels:
        app: prodb-backend
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: prodb-backend
        image: prodb/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8088
          name: http
          protocol: TCP
        env:
        - name: ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: db.name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: prodb-secrets
              key: db.user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prodb-secrets
              key: db.password
        - name: TDENGINE_HOST
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: tdengine.host
        - name: TDENGINE_PORT
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: tdengine.port
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: redis.port
        - name: CONSUL_HOST
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: consul.host
        - name: CONSUL_PORT
          valueFrom:
            configMapKeyRef:
              name: prodb-config
              key: consul.port
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: logs-volume
          mountPath: /var/log/prodb
      volumes:
      - name: config-volume
        configMap:
          name: prodb-config-files
      - name: logs-volume
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: prodb-backend-service
  namespace: prodb
  labels:
    app: prodb-backend
spec:
  type: ClusterIP
  ports:
  - port: 8088
    targetPort: 8088
    protocol: TCP
    name: http
  selector:
    app: prodb-backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prodb-config
  namespace: prodb
data:
  db.host: "postgres-service"
  db.port: "5432"
  db.name: "prodbmanager"
  tdengine.host: "tdengine-service"
  tdengine.port: "6030"
  redis.host: "redis-service"
  redis.port: "6379"
  consul.host: "consul-service"
  consul.port: "8500"

---
apiVersion: v1
kind: Secret
metadata:
  name: prodb-secrets
  namespace: prodb
type: Opaque
data:
  db.user: cG9zdGdyZXM=  # postgres (base64)
  db.password: cGFzc3dvcmQ=  # password (base64)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prodb-config-files
  namespace: prodb
data:
  app.yaml: |
    server:
      port: 8088
      host: "0.0.0.0"
    
    database:
      host: "${DB_HOST}"
      port: ${DB_PORT}
      name: "${DB_NAME}"
      user: "${DB_USER}"
      password: "${DB_PASSWORD}"
      max_connections: 100
      idle_connections: 10
    
    tdengine:
      host: "${TDENGINE_HOST}"
      port: ${TDENGINE_PORT}
      username: "root"
      password: "taosdata"
      database: "industrial_data"
    
    redis:
      host: "${REDIS_HOST}"
      port: ${REDIS_PORT}
      password: ""
      db: 0
    
    consul:
      host: "${CONSUL_HOST}"
      port: ${CONSUL_PORT}
    
    performance:
      max_memory_usage: 0.8
      gc_threshold: 0.7
      memory_check_interval: "30s"
      max_connections: 100
      idle_connections: 10
      connection_timeout: "30s"
      cache_size: 104857600
      cache_ttl: "1h"
      cache_clean_interval: "10m"
      auto_tuning_enabled: true
      tuning_interval: "5m"
      performance_target: 2000
    
    scalability:
      service_discovery:
        enabled: true
        registry: "consul"
        address: "${CONSUL_HOST}:${CONSUL_PORT}"
        namespace: "prodb"
        heartbeat_interval: "30s"
        ttl: "60s"
      
      load_balancer:
        enabled: true
        algorithm: "round_robin"
        health_check: true
        timeout: "30s"
      
      config_center:
        enabled: true
        provider: "consul"
        address: "${CONSUL_HOST}:${CONSUL_PORT}"
        namespace: "prodb/config"
        watch_config: true
      
      health_check:
        enabled: true
        interval: "10s"
        timeout: "5s"
        failure_threshold: 3
        success_threshold: 2
      
      scaling:
        auto_scaling: true
        min_instances: 2
        max_instances: 10
        cpu_threshold: 0.8
        memory_threshold: 0.8
        scale_up_cooldown: "5m"
        scale_down_cooldown: "10m"

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prodb-backend-hpa
  namespace: prodb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prodb-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prodb-backend-pdb
  namespace: prodb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: prodb-backend